name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Block scalar: the "Usage: ..." colon+space breaks YAML plain-scalar
      # parsing when inlined (this one line made the whole workflow invalid
      # since v0.1 — every run failed at 0s with "workflow file issue").
      - run: |
          node dist/cli.js 2>&1 | grep -q "Usage: aeko-shop-mcp personal|brand"
